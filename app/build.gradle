plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hector.cleanlauncher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hector.cleanlauncher'
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    aaptOptions { noCompress 'jpg' }
}
